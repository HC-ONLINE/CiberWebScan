name: CI

on:
  push:
    branches: [main, CI-testing]
  pull_request:
    branches: [main, CI-testing]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff==0.8.4 pyright==1.1.405

      - name: Run selected pre-commit hooks (ruff, ruff-format, pyright)
        run: |
          pre-commit run ruff ruff-format pyright --all-files

      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .

      - name: Pyright
        run: pyright

      - name: Pytest
        run: |
          PYTHONPATH=src pytest --cov --cov-report=xml --cov-report=term
