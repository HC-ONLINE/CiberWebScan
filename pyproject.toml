[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciberwebscan"
version = "2.5.0"
description = "Hybrid tool for passive reconnaissance, attack surface analysis, structured extraction and security assessment of web applications."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "HC-ONLINE", email = "henriquezandres856@gmail.com"}]
keywords = ["passive-reconnaissance", "attack-surface", "fingerprinting", "web-security", "web-scraping", "structured-extraction", "cli", "playwright", "beautifulsoup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

# core/CLI dependencies – these are pulled in when a user
# runs ``pip install ciberwebscan``. the command-line interface
# and the underlying scanning engine require these libraries.
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx[http2]==0.28.1",
    "playwright==1.61.0",
    "lxml==6.1.1",
    "pyOpenSSL==26.3.0",
    "cryptography==49.0.0",
    "python-dotenv==1.2.2",
    "typer==0.27.0",
    "rich==15.0.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.4",
    "orjson==3.11.9",
]

[project.optional-dependencies]
# users who only need the command-line interface can install the
# package normally; none of the API-specific requirements will be
# pulled in. to enable the REST server build the extra explicitly:
#
#     pip install "ciberwebscan[api]"
#
# the API implementation is located in ``src/ciberwebscan/api`` and
# depends on FastAPI/uvicorn, which are therefore kept out of the
# base dependency set.
api = [
    "fastapi==0.140.0",
    "uvicorn==0.51.0",
    "python-multipart==0.0.32",
]

dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-html==4.2.0",
    "ruff==0.16.0",
    "pyright==1.1.411",
    "pre-commit==4.6.1",
]

[project.urls]
Homepage = "https://github.com/HC-ONLINE/CiberWebScan"

[project.scripts]
ciberwebscan = "ciberwebscan.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ciberwebscan*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ciberwebscan = [
    "core/analyzers/fingerprint/*.json",
    "core/attacks/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=src/ciberwebscan",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
markers = [
    "slow: slow running tests",
    "integration: integration tests",
    "unit: unit tests",
]

[tool.coverage.run]
source = ["src/ciberwebscan"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ciberwebscan"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/ciberwebscan"]
exclude = ["**/__pycache__", "**/tests/**", "**/node_modules/**", "**/.venv/**", "**/.*", "**/build/**", "**/dist/**","**/*.egg-info"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
