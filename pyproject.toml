[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciberwebscan"
version = "0.0.1"
description = "Hybrid tool for passive reconnaissance, attack surface analysis, structured extraction and security assessment of web applications."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "HC-ONLINE", email = "henriquezandres856@gmail.com"}]
keywords = ["passive-reconnaissance", "attack-surface", "fingerprinting", "web-security", "web-scraping", "structured-extraction", "cli", "playwright", "beautifulsoup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx[http2]>=0.27.0",
    "playwright>=1.58.0",
    "lxml>=5.3.0",
    "pyOpenSSL>=24.0.0",
    "cryptography>=42.0.5",
    "python-dotenv>=1.1.1",
    "typer>=0.17.4",
    "rich>=13.0.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.0.0",
    "orjson>=3.9.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-html>=4.1.1",
    "ruff>=0.8.0",
    "pyright>=1.1.405",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/HC-ONLINE/CiberWebScan"

[project.scripts]
ciberwebscan = "ciberwebscan.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ciberwebscan*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ciberwebscan = [
    "core/analyzers/fingerprint/*.json",
    "core/attacks/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=src/ciberwebscan",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
markers = [
    "slow: slow running tests",
    "integration: integration tests",
    "unit: unit tests",
]

[tool.coverage.run]
source = ["src/ciberwebscan"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ciberwebscan"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/ciberwebscan"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
