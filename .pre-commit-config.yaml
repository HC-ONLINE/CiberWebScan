fail_fast: true
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(md|json|ya?ml)$

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: pyright
        language: python
        types: [python]
        pass_filenames: false
        additional_dependencies:
          - pyright==1.1.405
          - pydantic
          - python-dotenv
          - flask
          - typer
          - rich
          - httpx
          - playwright
          - beautifulsoup4
          - pyyaml
          - cryptography
          - orjson
