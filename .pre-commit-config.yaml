repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--line-length=88]

  - repo: https://github.com/PyCQA/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(md|json|ya?ml)$

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: pyright
        language: python
        types: [python]
        pass_filenames: false
        additional_dependencies:
          - pyright==1.1.405
          - python-dotenv
          - flask
          - typer
          - rich
          - httpx
          - selenium
          - beautifulsoup4
          - pyyaml
          - cryptography